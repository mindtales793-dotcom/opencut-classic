name: DarkCut Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [darkcut-studio]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Install dependencies
        run: bun install

      - name: TypeScript check
        run: bunx tsc --noEmit -p apps/web/tsconfig.json

      - name: Lint
        run: bun run lint:web
